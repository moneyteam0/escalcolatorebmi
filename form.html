<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore BMI</title>
    <link rel="stylesheet" href="stile.css">
</head>
<body>

    <div class="card">
        <h1>Calcolatore BMI</h1>
        <form action="bmi.php" method="post">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required placeholder="Inserisci il tuo nome">
            </div>
            
            <div class="form-group">
                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso" name="peso" step="0.1" required placeholder="Es. 70.5">
            </div>
            
            <div class="form-group">
                <label for="altezza">Altezza (cm)</label>
                <input type="number" id="altezza" name="altezza" required placeholder="Es. 178">
            </div>
            
            <button type="submit">Calcola</button>
        </form>
    </div>

</body>
</html>
